<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>릴멜 관리자</title>
<style>
:root{--bg:#D6E1FF;--card:#FFF;--ink:#2b3140;--sub:#6b7284;--mute:#9aa0ae;--line:#e5e7ee;--soft:#f4f5fa;--pri:#6D5AE3;--pri2:#4B37C9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 48px}
header{display:flex;align-items:center;gap:10px;padding:6px 4px 12px}
header h1{flex:1;margin:0;font-size:19px}
header small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(6,1fr);margin:0 -12px 12px;background:#FFF;border-bottom:1px solid var(--line)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;border:0;border-bottom:3px solid transparent;background:none;color:var(--sub);font-size:12px;font-weight:600}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hit{padding:12px 0;border-top:1px solid var(--line)}
.hit:first-of-type{border-top:0;padding-top:0}
.hit p{margin:0}
.hit .top{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.hit .ch{margin:4px 0 2px;font-weight:600}
.hit .lp{font-size:13px;color:var(--sub)}
.hit .env{font-size:12px;color:#7a8092}
.bars{margin:0;padding:0;list-style:none}
.bars li{display:grid;grid-template-columns:1fr 48px 44px;align-items:center;gap:6px;margin:6px 0}
.bars .lbl{position:relative;min-width:0;padding:6px 10px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .lbl i{position:absolute;left:0;top:0;bottom:0;background:#EDE9FE;border-radius:8px}
.bars .lbl span{position:relative}
.bars b{text-align:right;font-variant-numeric:tabular-nums}
.bars em{text-align:right;font-style:normal;color:var(--sub);font-size:13px}
.unit{margin:6px 0 0;text-align:right;font-size:12px;color:var(--mute)}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
h2{margin:0 0 12px;font-size:17px}
h2 small{margin-left:6px;font-size:12px;font-weight:400;color:var(--sub)}
.sub{margin:18px 0 8px;font-size:13px;font-weight:700}
.sub span{margin-left:4px;font-weight:400;color:var(--mute)}
.dim{margin:10px 0 0;font-size:13px;color:var(--sub)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{background:var(--soft);border-radius:12px;padding:12px;min-width:0}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi b small{margin-left:4px;font-size:12px;color:var(--sub)}
.kpi span{font-size:12px;color:var(--sub)}
.seg{display:flex;gap:4px;margin:0 0 10px;padding:3px;background:#f1f2f6;border-radius:10px}
.seg button{flex:1;height:34px;border:0;border-radius:8px;background:none;color:var(--sub);font-size:13px;font-weight:600}
.seg button.on{background:#FFF;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chart{position:relative;height:160px;padding:0 0 22px 28px;border-bottom:1px solid #d9dce4;display:flex;align-items:flex-end;gap:2px}
.chart .g{position:absolute;left:0;right:0;border-top:1px dashed #eceef3;pointer-events:none}
.chart .g i{position:absolute;left:0;top:-8px;padding-right:3px;background:#FFF;font-style:normal;font-size:10px;color:var(--mute)}
.chart .c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;cursor:pointer;min-width:0}
.chart .c b{width:64%;max-width:18px;min-height:2px;background:var(--pri);border-radius:4px 4px 0 0}
.chart .c.today b{background:var(--pri2)}
.chart .c.sel b{background:#2b3140}
.chart .c em{position:absolute;bottom:-20px;font-style:normal;font-size:10px;color:var(--sub);white-space:nowrap}
.chart .tip{position:absolute;top:-6px;right:0;padding:4px 9px;border-radius:8px;background:#2b3140;color:#FFF;font-size:12px;font-weight:600;white-space:nowrap;z-index:2}
.list{margin:0;padding:0;list-style:none;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list li{display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 12px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list li.tap{cursor:pointer}
.list li.tap:active{background:var(--soft)}
.list .m{flex:1;min-width:0}
.list .m p{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .m small{display:block;font-size:12px;color:var(--sub)}
.list .r{flex:none;text-align:right;font-size:12px;color:var(--sub)}
.list .empty{justify-content:center;color:var(--mute);font-size:13px}
.pill{display:inline-block;margin-left:5px;padding:0 7px;border-radius:7px;font-size:11px;font-weight:700;line-height:1.7;vertical-align:1px}
.pill.app{background:#E2F5EA;color:#1E7A4D}
.pill.web{background:#E3EEFD;color:#2D5FB8}
.pill.est{background:#FFF0C2;color:#8A6400}
.btn{height:46px;padding:0 16px;border:0;border-radius:10px;background:var(--pri);color:#FFF;font-size:15px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.ghost{background:#EEF0F4;color:var(--ink)}
.btn.small{height:36px;padding:0 12px;font-size:13px}
.full{width:100%;margin-top:10px}
input,select,textarea{width:100%;height:46px;padding:0 12px;border:1px solid #c9ccd6;border-radius:10px;background:#FFF}
label{display:block;margin:10px 0 0;font-size:13px;color:var(--sub)}
label input{margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;gap:8px}
.row input{flex:1}
.msg{margin:8px 0 0;color:var(--pri);font-weight:600;font-size:14px}
.box{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fafbfd}
.box p{margin:0 0 6px}
code{font-size:12px;background:#f1f2f6;padding:1px 5px;border-radius:4px;word-break:break-all}
.center{text-align:center;padding:28px 16px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>릴멜 관리자<small id="who">로그인이 필요합니다</small></h1><button id="out" class="btn ghost small hide" type="button">로그아웃</button></header>
  <div id="root"><div class="card center">불러오는 중…</div></div>
</div>
<script type="module" src="./admin.js"></script>
</body>
</html>

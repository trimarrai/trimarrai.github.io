<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="flat.css">
<style>.f{position:relative;width:1080px;height:1920px;overflow:hidden}
.f{background:#1E1A4D}
.bd{position:absolute;top:150px;left:50%;translate:-50% 0;padding:12px 34px;border:4px solid #FF7AB6;border-radius:999px;font-size:38px;font-weight:900;color:#FF7AB6;white-space:nowrap}
.t{position:absolute;top:260px;left:0;right:0;text-align:center;font-size:72px;line-height:1.38;font-weight:900;color:#FFF}
.t em{font-style:normal;color:#FF7AB6}
.moon{position:absolute;left:760px;top:520px;width:200px;height:200px;border-radius:50%;background:#FFE066}.moon::after{content:"";position:absolute;left:60px;top:-20px;width:190px;height:190px;border-radius:50%;background:#1E1A4D}
.row{position:absolute;top:760px;left:0;right:0;display:flex;justify-content:center;gap:34px}
.row span{position:relative;width:270px}.row .bk{border-color:#FF7AB6;background:#2E2770}
.row b{position:absolute;left:50%;bottom:-40px;translate:-50% 0;padding:6px 26px;border-radius:999px;background:#FFF;font-size:34px;font-weight:900;color:#1E1A4D}
.row .on .bk{background:#FF7AB6;border-color:#FFF}.row .on{translate:0 -40px}
.cd{position:absolute;left:50%;top:330px;width:560px;margin-left:-280px;rotate:-3deg;outline:8px solid #FF7AB6;outline-offset:10px;border-radius:30px}
.ans{position:absolute;left:80px;right:80px;top:1400px;padding:36px;border:5px solid #FF7AB6;border-radius:44px;text-align:center;font-size:54px;line-height:1.45;font-weight:900;color:#FFF}
.ans small{display:block;font-size:38px;color:#C9C3F2;font-weight:700}</style></head><body>
<div class="f" id="frame">
<span class="bd">이번 주 연락운</span>
<div class="cd"><img class="tcard" src="cards/tr17@2x.jpg" alt="Star(별)" style="border:0;border-radius:24px;background:none"></div>
<div class="ans">네, <span style="color:#FF7AB6">이번 주 안에 연락이 와요</span><small>미래 · Star(별) — 멈춰 있던 마음이 이어지는 카드</small></div>
</div>

</body></html>

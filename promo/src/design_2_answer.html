<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="flat.css">
<style>.f{position:relative;width:1080px;height:1920px;overflow:hidden}
.f{background:#B9D7F0}
.top{position:absolute;left:0;right:0;top:0;height:200px;background:#A8CBE8;display:flex;align-items:flex-end;padding:0 50px 34px;gap:26px;font-size:46px;font-weight:900;color:#1F2A44}
.top i{font-style:normal;font-size:50px}
.av{width:90px;height:90px;border-radius:32px;background:#FFF;overflow:hidden;flex:none}.av img{width:150%;margin:10px 0 0 -25%}
.msg{position:absolute;max-width:760px;padding:28px 36px;border-radius:40px;font-size:48px;line-height:1.45;font-weight:700;color:#1F2A44;background:#FFF}
.me{right:50px;background:#FFE94A;border-top-right-radius:10px}
.you{left:170px;border-top-left-radius:10px}
.who{position:absolute;left:170px;font-size:34px;font-weight:700;color:#3a4a66}
.pf{position:absolute;left:50px;width:100px;height:100px;border-radius:36px;background:#FFF;overflow:hidden}.pf img{width:160%;margin:12px 0 0 -30%}
.tm{position:absolute;font-size:28px;color:#4a5a76}
.day{position:absolute;left:50%;translate:-50% 0;padding:8px 30px;border-radius:999px;background:#9DBCD8;font-size:32px;color:#FFF;font-weight:700;white-space:nowrap}
.photo{position:absolute;left:170px;width:420px;border-radius:30px;overflow:hidden}
.typing{position:absolute;left:170px;padding:30px 40px;background:#FFF;border-radius:40px;border-top-left-radius:10px;font-size:60px;letter-spacing:10px;color:#9aa}</style></head><body>
<div class="f" id="frame">
<div class="top"><i>‹</i><div class="av"><img src="../../images/mm01.png"></div>릴멜 🔮</div>
<span class="day" style="top:260px">이번 주 연락운</span>
<div class="pf" style="top:360px"><img src="../../images/mm01.png"></div><span class="who" style="top:360px">릴멜</span>
<div class="photo" style="top:410px"><img class="tcard" src="cards/tr17@2x.jpg" alt="Star(별)" style="border:0;border-radius:0;background:none"></div>
<div class="msg you" style="top:1170px">미래 카드는 <b>Star(별)</b> ✨</div>
<div class="msg you" style="top:1330px"><b>네, 이번 주 안에 연락이 와요</b><br>멈춰 있던 마음이 이어지는 카드예요</div>
<div class="msg me" style="top:1600px">진짜?! 💓</div>
</div>
<script src="sparkle.js"></script><script></script>
</body></html>

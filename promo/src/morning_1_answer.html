<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="flat.css">
<style>.f{position:relative;width:1080px;height:1920px;overflow:hidden}
.bd{position:absolute;top:150px;left:50%;translate:-50% 0;padding:12px 34px;border-radius:999px;font-size:38px;font-weight:900;white-space:nowrap;z-index:5}
.t{position:absolute;top:250px;left:0;right:0;text-align:center;font-size:72px;line-height:1.38;font-weight:900;z-index:5}
.row{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:34px;z-index:4}
.row span{position:relative;width:260px}
.row b{position:absolute;left:50%;bottom:-40px;translate:-50% 0;padding:6px 26px;border-radius:999px;background:#FFF;font-size:34px;font-weight:900;color:var(--ink)}
.row .on{translate:0 -40px}
.cd{position:absolute;left:50%;width:540px;margin-left:-270px;rotate:-3deg;z-index:4}
.ans{position:absolute;left:80px;right:80px;padding:36px;background:#FFF;border-radius:44px;text-align:center;font-size:54px;line-height:1.45;font-weight:900;color:var(--ink);z-index:5}
.ans small{display:block;font-size:38px;color:var(--mute);font-weight:700}
.oc{position:absolute;left:50%;width:480px;margin-left:-240px;z-index:4}
.f{background:#FFF6E0}
.bd{background:#FFB74D;color:#FFF}.t{color:#5D4037}
.wall{position:absolute;left:0;right:0;bottom:0;height:330px;background:#F3E2C0}
.win{position:absolute;left:170px;top:560px;width:740px;height:820px;background:#BDE6FF;border:26px solid #FFF;border-radius:30px;overflow:hidden}
.win .sun{position:absolute;left:250px;top:430px;width:240px;height:240px;border-radius:50%;background:#FFD54F}
.win .hill{position:absolute;left:-60px;right:-60px;top:560px;height:500px;border-radius:50%;background:#A5D6A7}
.win .bar{position:absolute;background:#FFF}
.cur{position:absolute;top:520px;width:230px;height:900px;background:#FFAB91;border-radius:0 0 120px 120px}
.sill{position:absolute;left:130px;width:820px;top:1360px;height:50px;background:#FFF;border-radius:14px}</style></head><body>
<div class="f" id="frame">
<span class="bd">☀️ 이번 주 연락운</span><div class="win"><div class="sun"></div><div class="hill"></div><div class="bar" style="left:345px;top:0;width:26px;height:820px"></div><div class="bar" style="left:0;top:380px;width:740px;height:26px"></div></div>
<div class="cur" style="left:80px"></div><div class="cur" style="right:80px"></div><div class="sill"></div><div class="wall"></div><div class="cd" style="top:330px"><img class="tcard" src="cards/tr17@2x.jpg" alt="Star(별)" style="border:0;border-radius:24px;background:none"></div><div class="ans" style="top:1420px"><span class="mk">네, 이번 주 안에 연락이 와요</span><small>미래 · Star(별) — 멈춰 있던 마음이 이어지는 카드</small></div>
</div></body></html>

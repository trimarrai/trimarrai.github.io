<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="flat.css">
<style>.f{position:relative;width:1080px;height:1920px;overflow:hidden}
.bd{position:absolute;top:150px;left:50%;translate:-50% 0;padding:12px 34px;border-radius:999px;font-size:38px;font-weight:900;white-space:nowrap;z-index:5}
.t{position:absolute;top:250px;left:0;right:0;text-align:center;font-size:72px;line-height:1.38;font-weight:900;z-index:5}
.row{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:34px;z-index:4}
.row span{position:relative;width:260px}
.row b{position:absolute;left:50%;bottom:-40px;translate:-50% 0;padding:6px 26px;border-radius:999px;background:#FFF;font-size:34px;font-weight:900;color:var(--ink)}
.row .on{translate:0 -40px}
.cd{position:absolute;left:50%;width:540px;margin-left:-270px;rotate:-3deg;z-index:4}
.ans{position:absolute;left:80px;right:80px;padding:36px;background:#FFF;border-radius:44px;text-align:center;font-size:54px;line-height:1.45;font-weight:900;color:var(--ink);z-index:5}
.ans small{display:block;font-size:38px;color:var(--mute);font-weight:700}
.oc{position:absolute;left:50%;width:480px;margin-left:-240px;z-index:4}
.f{background:#8FD3FF}
.bd{background:#FFF;color:#1E88E5}.t{color:#0D3B66}.t .mk{background:#FFE066}
.sun{position:absolute;left:720px;top:380px;width:300px;height:300px;border-radius:50%;background:#FFE066}
.sun::after{content:"";position:absolute;inset:-40px;border-radius:50%;border:16px dashed #FFE066}
.cl{position:absolute;height:120px;border-radius:60px;background:#FFF}
.cl::before{content:"";position:absolute;left:25%;top:-60px;width:50%;height:150px;border-radius:50%;background:#FFF}
.bird{position:absolute;font-size:50px;color:#0D3B66;font-weight:900}
.grass{position:absolute;left:-100px;right:-100px;top:1680px;height:600px;border-radius:50%;background:#9CCC65}</style></head><body>
<div class="f" id="frame">

</div></body></html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="flat.css"><link rel="stylesheet" href="earth.css"><link rel="stylesheet" href="love.css"><link rel="stylesheet" href="instinct.css">
<style>
.series{background:#FFF}
.snow{position:absolute;border-radius:50%;background:#FFF;opacity:.85}
.box{position:absolute;left:80px;right:80px;padding:34px 40px;background:#FFF;border-radius:44px;text-align:center;font-size:54px;line-height:1.45;font-weight:900;color:var(--ink)}
.tt{top:330px}
.cm{position:absolute;top:760px;left:90px;right:90px;padding:40px;background:#FFF;border-radius:44px;text-align:center}
.cm small{display:block;font-size:36px;font-weight:800;color:var(--mute)}.cm b{display:block;margin-top:10px;font-size:76px;font-weight:900;color:var(--ink)}
.bok{position:absolute;top:1100px;left:50%;translate:-50% 0;padding:20px 44px;background:#F06292;border-radius:999px;font-size:50px;font-weight:900;color:#FFF;white-space:nowrap}
.go{position:absolute;top:1260px;left:0;right:0;text-align:center;font-size:40px;font-weight:800;color:#FFE066}</style></head><body>
<div class="f nt" id="frame">
  <span class="series">올해가 가기 전에 🎄</span>
 <p class="tt">정리할 게<br><span class="mk">떠올랐다면</span></p>
  <div class="cm"><small>댓글로 다짐을 남겨 주세요 👇</small><b>"정리할게요"</b></div>
  <span class="bok">복채는 ❤️ 두 번 톡톡</span>
  <p class="go">새해 첫 카드는 프로필 링크에서 무료로 🔮</p>
  <img class="octo" src="../../images/mm01.png" alt="릴멜" style="top:1580px;width:460px;margin-left:-230px">
  <div class="mound" style="background:#E8ECFF"></div>
</div>
<script>
// 눈송이 (단색 점)
(function(){var f=document.getElementById('frame'),h='',s=[[40,620,10],[1020,600,9],[50,1100,8],[1010,1180,10],[120,1640,7],[940,1620,9],[60,880,6],[1020,900,7],[300,1700,6],[780,1720,8]];
s.forEach(function(p){h+='<span class="snow" style="left:'+p[0]+'px;top:'+p[1]+'px;width:'+p[2]*2+'px;height:'+p[2]*2+'px"></span>'});f.insertAdjacentHTML('afterbegin',h)})()
</script>
<script src="anim.js"></script>
<script>function ANIM(t){$('.snow').forEach(function(el,i){el.style.translate=(Math.sin(t*1.5+i)*12)+'px '+((t*40+i*37)%120-60)+'px'}); pop('.series',t,0,.3);var e=type('.tt',t,.1,10); pop('.cm',t,e+.1,.45); pop('.bok',t,e+.8,.4); set('.bok',{scale:String(1+.05*Math.max(0,Math.sin((t-e-1.3)*6))*(t>e+1.3))}); type('.go',t,e+1.3,10);}</script>
</body></html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="flat.css"><link rel="stylesheet" href="earth.css">
<style>
/* 0–3초: 우주에서 날아오는 중 */
.planet{position:absolute;left:640px;top:560px;width:300px;height:300px;border-radius:50%;background:#BF77FF}
.planet::before{content:"";position:absolute;left:60px;top:70px;width:70px;height:70px;border-radius:50%;background:#D9A8FF}
.planet::after{content:"";position:absolute;left:150px;top:170px;width:44px;height:44px;border-radius:50%;background:#D9A8FF}
.ring{position:absolute;left:560px;top:670px;width:460px;height:90px;border-radius:50%;border:14px solid #FFE066;rotate:-14deg}
.ring.front{clip-path:inset(50% 0 0 0)}
.pname{position:absolute;left:600px;top:900px}
.met{position:absolute;left:150px;top:900px;width:620px;height:620px;rotate:0deg}
.earth{position:absolute;left:-160px;right:-160px;top:1560px;height:1400px;border-radius:50%;background:#5FB8EE}
.land{position:absolute;border-radius:50%;background:#7DD3A0}
</style></head><body>
<div class="f night" id="frame">
  <span class="ep">릴멜의 지구 적응기 #1</span>
  <p class="tt">30억 광년 떨어진 별에서<br><span class="mk">누군가</span> 날아오고 있어요</p>
  <div class="ring"></div><div class="planet"></div><div class="ring front"></div>
  <span class="chip pname" style="background:#4A3FA0;color:#FFF">아리미오니오니별</span>
  <!-- 별똥별(단색) 안에 릴멜 -->
  <svg class="met" viewBox="0 0 620 620">
    <path d="M40 40 L470 400 A70 70 0 1 1 400 470 Z" fill="#FFF"/>
    <path d="M110 60 L450 360" stroke="#FFE066" stroke-width="16" stroke-linecap="round"/>
    <path d="M60 120 L360 450" stroke="#FFE066" stroke-width="12" stroke-linecap="round"/>
    <circle cx="452" cy="452" r="62" fill="#BF77FF"/><circle cx="432" cy="452" r="9" fill="#FFF"/><circle cx="472" cy="452" r="9" fill="#FFF"/>
  </svg>
  <div class="earth"></div>
  <div class="land" style="left:120px;top:1640px;width:300px;height:120px"></div>
  <div class="land" style="left:640px;top:1610px;width:260px;height:150px"></div>
  <div class="land" style="left:420px;top:1790px;width:240px;height:110px"></div>
  <span class="chip" style="left:400px;top:1700px">지구</span>
</div>
<script src="sparkle.js"></script>
<script>sparkles([[70,480,56,'#FFE066'],[960,420,64,'#FFF'],[80,1100,50,'#FFF'],[930,1120,50,'#FFE066'],[860,1400,40,'#FFF']],
 [[300,520,7,'#FFF'],[520,560,8,'#FFF'],[1010,1000,8,'#FFF'],[40,800,8,'#FFF'],[600,1450,7,'#FFE066'],[180,1450,8,'#FFF']])</script>
</body></html>

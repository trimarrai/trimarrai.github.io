<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="flat.css"><link rel="stylesheet" href="earth.css">
<style>
/* 6–10초: 친구들을 만남 */
.fr{position:absolute}
.hi{position:absolute;padding:14px 26px;background:#FFF;border-radius:30px;font-size:38px;font-weight:900;color:var(--ink)}
.heart{position:absolute;font-size:60px;color:#F48FB1;font-weight:900}
</style></head><body>
<div class="f" id="frame">
  <span class="ep">릴멜의 지구 적응기 #1</span>
  <p class="tt">낯선 지구에서<br><span class="mk">친구들</span>을 만났어요</p>
  <img class="fr" src="../../images/ic_sealion_pink_big_01.webp" alt="율리움" style="left:40px;top:640px;width:440px">
  <span class="chip" style="left:150px;top:960px">율리움</span>
  <span class="hi" style="left:300px;top:540px">안녕!</span>
  <img class="fr" src="../../images/com_starfish_02.webp" alt="트리마레" style="left:640px;top:560px;width:250px;rotate:12deg">
  <span class="chip" style="left:670px;top:830px">트리마레</span>
  <img class="fr" src="../../images/com_pew_512.webp" alt="퓨" style="left:760px;top:900px;width:230px">
  <span class="chip" style="left:830px;top:1170px">퓨</span>
  <span class="heart" style="left:520px;top:780px">♥</span>
  <img class="hillF" src="hill.png" alt="" style="bottom:-380px">
</div>
<script src="sparkle.js"></script>
<script>sparkles([[960,460,56,'#FFD43B'],[60,470,50,'#FFF'],[930,880,44,'#FFF'],[60,1150,50,'#FFD43B']],
 [[300,500,8,'#FFF'],[1000,700,8,'#FFF'],[500,1250,7,'#FFF']])</script>
<script src="anim.js"></script>
<script>function ANIM(t){
  pop('.ep',t,0,.3); rise('.tt',t,0)
  var fr=$('.fr')
  var a=E.back(E.p(t,.2,.8)); fr[0].style.translate=(-500*(1-a))+'px '+Math.sin(t*3)*10+'px'
  var b=E.back(E.p(t,.5,1.1)); fr[1].style.scale=String(Math.max(0,b)); fr[1].style.rotate=(12+360*(1-E.out(E.p(t,.5,1.1))))+'deg'
  var c=E.out(E.p(t,.8,1.4)); fr[2].style.translate='0 '+(400*(1-c)+Math.sin(t*3+1)*14)+'px'; fr[2].style.opacity=c
  var ch=$('.chip'); [ .9,1.2,1.5].forEach(function(s,i){var x=E.p(t,s,s+.4); ch[i].style.opacity=x>0?1:0; ch[i].style.scale=String(E.back(x))})
  pop('.hi',t,1.4,.4); set('.heart',{opacity:E.p(t,1.8,2),scale:String(1+.15*Math.sin(t*8))})
  set('.hillF',{translate:'0 '+(Math.sin(t*3)*10)+'px'})
}</script>
</body></html>

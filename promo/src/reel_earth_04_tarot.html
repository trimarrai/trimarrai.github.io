<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="flat.css"><link rel="stylesheet" href="earth.css">
<style>
/* 10–15초: 그래서 타로를 읽기로 */
.fan3{top:520px}.fan3>span{width:280px}.fan3 .c{width:330px;margin-left:-165px}
.fan3 .l{margin-left:-420px;top:50px}.fan3 .r{margin-left:140px;top:50px}
.me{position:absolute;left:50%;top:1070px;width:820px;margin-left:-410px}
.mound{top:1520px}
.go{position:absolute;left:0;right:0;top:1620px;text-align:center}
.go span{display:inline-block;padding:20px 44px;background:var(--ink);border-radius:999px;font-size:44px;font-weight:900;color:#FFF}
.go b{color:#FFE066}
</style></head><body>
<div class="f" id="frame">
  <span class="ep">릴멜의 지구 적응기 #1</span>
  <p class="tt">그래서… 지구에서<br><span class="mk">타로를 읽어 주기로</span> 했대요</p>
  <div class="fan3">
    <span class="l"><img class="tcard" src="cards/tr1@2x.jpg" alt="마법사"></span>
    <span class="r"><img class="tcard" src="cards/tr21@2x.jpg" alt="세계"></span>
    <span class="c"><img class="tcard" src="cards/tr17@2x.jpg" alt="별"></span>
  </div>
  <div class="mound"></div>
  <img class="me" src="../../images/mm01.png" alt="릴멜">
  <p class="go"><span>오늘의 카드, 보러 올래요? <b>👉 프로필 링크</b></span></p>
</div>
<script src="sparkle.js"></script>
<script>sparkles([[60,460,56,'#FFD43B'],[960,450,60,'#FFF'],[60,1050,46,'#FFF'],[960,1000,50,'#FFD43B']],
 [[300,480,8,'#FFF'],[1000,800,8,'#FFF']])</script>
<script src="anim.js"></script>
<script>function ANIM(t){
  pop('.ep',t,0,.3); rise('.tt',t,0)
  var x=E.back(E.p(t,.5,1.1))
  set('.fan3 .l',{translate:(1-x)*300+'px 0',opacity:E.p(t,.5,.6)}); set('.fan3 .r',{translate:-(1-x)*300+'px 0',opacity:E.p(t,.5,.6)})
  pop('.fan3 .c',t,.3,.45)
  var m=E.out(E.p(t,0,.6)); set('.me',{translate:'0 '+((1-m)*500+Math.sin(t*3.2)*14)+'px',rotate:Math.sin(t*1.6)*3+'deg'})
  pop('.go',t,1.6,.45); set('.go span',{scale:String(1+.04*Math.max(0,Math.sin((t-2.1)*5))*(t>2.1))})
}</script>
</body></html>

<html lang="ko"><head><meta charset="utf-8">

</style></head><body>

  <span class="ep">솔로 연애운 최고의 카드 TOP 3</span>

</div>

<script>sparkles([[60,1000,50,'#FFF'],[970,980,56,'#FFD43B']],[[300,330,8,'#FFF'],[1010,700,8,'#FFF']])</script>
<script src="anim.js"></script>
<script>function ANIM(t){set('.pq',{translate:'0 '+Math.sin(t*3)*12+'px'}); $('.heart').forEach(function(el,i){el.style.scale=String(1+.15*Math.sin(t*6+i*2))});
  pop('.ep',t,0,.3); var D=1.2;
  var sh=E.p(t,.2,1)*(1-E.p(t,1,1.05)); set('.bkc',{scale:(1-E.p(t,D-.2,D))+' 1',translate:(Math.sin(t*60)*12*sh)+'px 0'});
  set('.pre',{opacity:E.p(t,.1,.4)*(1-E.p(t,D-.2,D))});
  var f=E.out(E.p(t,D,D+.3)); set('.card',{scale:f+' 1'}); pop('.rank',t,D+.3,.4); pop('.lv',t,D+.5,.4);
  var e=type('.mean',t,D+.9,10); pop('.stk',t,e+.2,.4); $('.stk').forEach(function(el){el.style.rotate=(8+Math.sin(t*8)*5)+'deg'});
}</script>
</body></html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="flat.css">
<style>.f{position:relative;width:1080px;height:1920px;overflow:hidden}
.bd{position:absolute;top:150px;left:50%;translate:-50% 0;padding:12px 34px;border-radius:999px;font-size:38px;font-weight:900;white-space:nowrap;z-index:5}
.t{position:absolute;top:250px;left:0;right:0;text-align:center;font-size:72px;line-height:1.38;font-weight:900;z-index:5}
.row{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:34px;z-index:4}

.row .on{translate:0 -40px}
.cd{position:absolute;left:50%;width:540px;margin-left:-270px;rotate:-3deg;z-index:4}
.ans{position:absolute;left:80px;right:80px;padding:36px;background:#FFF;border-radius:44px;text-align:center;font-size:54px;line-height:1.45;font-weight:900;color:var(--ink);z-index:5}
.ans small{display:block;font-size:38px;color:var(--mute);font-weight:700}
.oc{position:absolute;left:50%;width:480px;margin-left:-240px;z-index:4}
.f{background:#FFE5D6}
.bd{background:#FF8A65;color:#FFF}.t{color:#5D4037}
.bed{position:absolute;left:-100px;right:-100px;top:1300px;height:900px;background:#FFFFFF;border-radius:80px}
.blanket{position:absolute;left:-100px;right:-100px;top:1480px;height:800px;background:#FFCCBC;border-radius:80px}
.pillow{position:absolute;left:120px;top:1200px;width:520px;height:220px;background:#FFF;border-radius:110px;border:10px solid #FFE0D2}
.phone{position:absolute;left:640px;top:1080px;width:300px;height:520px;background:#3B2E8C;border-radius:44px;padding:20px;rotate:8deg;z-index:3}
.phone .sc{width:100%;height:100%;background:#FFF6E0;border-radius:30px;padding:30px 18px}

.phone .nt{margin-top:30px;background:#FFF;border-radius:22px;padding:16px;font-size:26px;font-weight:800;color:#3B2E8C;box-shadow:none;border:3px solid #FFD0BE}
.sunw{position:absolute;left:760px;top:460px;width:200px;height:200px;border-radius:50%;background:#FFD54F}
.sunw{left:930px;top:90px;width:130px;height:130px}
.phone.bigp{left:290px!important;top:300px!important;width:500px!important;height:820px!important;margin-left:0;rotate:-4deg;padding:28px;z-index:4}
.bigp .tm{font-size:110px;margin-top:20px}.bigp .nt{margin-top:50px;font-size:44px;padding:28px;border-radius:30px}
.bigp .rp{margin-top:50px;padding:22px 0;border-radius:999px;background:#FF7AB6;color:#FFF;text-align:center;font-size:42px;font-weight:900}
.ln{position:absolute;left:50px;right:50px;text-align:center;font-size:50px;line-height:1.5;font-weight:900;color:#5D4037;z-index:5}</style></head><body>
<div class="f" id="frame">

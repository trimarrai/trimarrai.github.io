<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="flat.css">
<style>
/* 릴스 '카드 고르기' · 9–15초: 번호별 메시지 (2번 예시 · 1번/3번도 같은 틀) */
.top{top:160px}
.card{top:300px;width:600px;--r:-3deg}
.card .no{bottom:auto;top:-36px;left:auto;right:-30px;margin:0;width:140px;height:140px;line-height:140px;font-size:84px}
.bub{position:absolute;left:70px;right:70px;top:1180px;padding:44px 52px 50px;background:#FFF;border-radius:52px;z-index:2}
.bub::after{content:"";position:absolute;left:50%;margin-left:-34px;bottom:-46px;border-left:34px solid transparent;border-right:34px solid transparent;border-top:48px solid #FFF}
.who{display:inline-block;padding:8px 26px;background:var(--octo);border-radius:999px;color:#FFF;font-size:32px;font-weight:800}
.kw{display:inline-block;margin-left:12px;padding:8px 22px;background:#FFF5C2;border-radius:999px;color:var(--ink);font-size:30px;font-weight:800}
.line{margin-top:22px;font-size:60px;line-height:1.45;font-weight:900;color:var(--ink)}
</style></head><body>
<div class="f" id="frame">
  <div class="top"><span class="pill">2번을 고른 당신에게</span></div>
  <div class="big card"><img class="tcard" src="cards/tr17@2x.jpg" alt="별 카드"><b class="no">2</b></div>
  <div class="bub"><span class="who">릴멜</span><span class="kw">별 · 희망</span>
    <p class="line">지친 마음에<br><span class="mk">희망이 다시 차올라요.</span></p></div>
  <div class="mound"></div>
  <img class="octo" src="../../images/mm01.png" alt="">
</div>
<script src="sparkle.js"></script>

 [[60,760,8,'#FFF'],[1030,760,9,'#FFF'],[150,1700,8,'#FFF'],[930,1700,8,'#FFF']])</script>
</body></html>

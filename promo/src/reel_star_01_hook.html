<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="flat.css">
<style>
/* 릴스 '별' 편 · 0–2초 훅: 밤하늘 + 뒷면 카드 */
.hook{position:absolute;top:300px;left:0;right:0;text-align:center;color:#FFF;font-size:68px;line-height:1.4;font-weight:900}
.hook .mk{color:var(--ink)}
.moon{position:absolute;left:50%;top:620px;width:620px;height:620px;margin-left:-310px;border-radius:50%;background:#4A3FA0}
.cb{position:absolute;left:50%;top:600px;width:380px;height:651px;margin-left:-190px;transform:rotate(4deg);border-radius:28px;border:12px solid #FFF;background:#6D5AE3;overflow:hidden}
.cb .in{position:absolute;inset:22px;border:5px solid #FFE066;border-radius:14px}
.cb svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.q{position:absolute;left:50%;top:1300px;margin-left:-60px;width:120px;height:120px;border-radius:50%;background:#FFE066;color:var(--ink);font-size:84px;font-weight:900;line-height:120px;text-align:center;transform:rotate(-8deg)}

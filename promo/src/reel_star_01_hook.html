<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="flat.css">
<style>
/* 릴스 '별' 편 · 0–2초 훅: 밤하늘 + 큰 뒷면 카드 */
.hook{position:absolute;top:200px;left:0;right:0;text-align:center;color:#FFF;font-size:64px;line-height:1.4;font-weight:900}
.hook .mk{color:var(--ink)}
.cb{top:430px;width:640px;height:1097px;--r:3deg;border-radius:34px;border:16px solid #FFF;background:#6D5AE3;overflow:hidden}
.cb .in{position:absolute;inset:30px;border:6px solid #FFE066;border-radius:18px}
.cb svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.q{position:absolute;left:760px;top:1380px;width:150px;height:150px;border-radius:50%;background:#FFE066;color:var(--ink);font-size:104px;font-weight:900;line-height:150px;text-align:center;transform:rotate(-8deg)}
.f.night .mound{background:#4A3FA0}
</style></head><body>
<div class="f night" id="frame">
  <p class="hook">이 영상을 본 당신에게<br><span class="mk">온 카드</span>예요</p>
  <div class="big cb"><div class="in"></div>
    <svg width="340" height="340" viewBox="0 0 10 10"><path d="M5 0Q5.6 4.4 10 5Q5.6 5.6 5 10Q4.4 5.6 0 5Q4.4 4.4 5 0z" fill="#FFE066"/></svg>
    <svg width="80" height="80" viewBox="0 0 10 10" style="top:14%"><circle cx="5" cy="5" r="4" fill="#FFF"/></svg>
    <svg width="80" height="80" viewBox="0 0 10 10" style="top:86%"><circle cx="5" cy="5" r="4" fill="#FFF"/></svg>
  </div>
  <div class="q">?</div>
  <div class="mound"></div>
  <img class="octo" src="../../images/mm01.png" alt="">
</div>
<script src="sparkle.js"></script>
<script>sparkles([[60,560,64,'#FFE066'],[960,520,70,'#FFF'],[970,1200,50,'#FFE066'],[50,1250,70,'#FFF'],[120,100,50,'#FFF'],[900,90,44,'#FFE066']],
 [[60,900,8,'#FFF'],[1030,900,9,'#FFF'],[540,120,6,'#FFF'],[180,1640,8,'#FFF'],[900,1640,8,'#FFF']])</script>
</body></html>

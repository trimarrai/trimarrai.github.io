<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="flat.css">
<style>
/* 릴스 '별' 편 · 4–9초: 카드 공개 (카드를 화면 가득) */
.top{top:180px}
.plate{position:absolute;left:50%;top:330px;width:640px;height:1097px;margin-left:-300px;border-radius:34px;background:var(--octo);transform:rotate(5deg)}
.card{top:300px;width:640px;--r:-3deg}
.title{position:absolute;top:1450px;left:0;right:0;text-align:center;font-size:0}
.num{display:inline-block;vertical-align:middle;padding:8px 24px;background:var(--ink);border-radius:999px;font-size:34px;font-weight:800;letter-spacing:.15em;color:#FFF}
.name{display:inline-block;vertical-align:middle;margin-left:22px;font-size:104px;line-height:1.1;font-weight:900;color:var(--ink)}
.msg{position:absolute;top:1580px;left:0;right:0;text-align:center;font-size:46px;font-weight:800;color:var(--ink);z-index:2}
</style></head><body>
<div class="f" id="frame">
  <div class="top"><span class="pill">🐙 릴멜이 고른 오늘의 카드</span></div>
  <div class="plate"></div>
  <div class="big card"><img class="tcard" src="cards/tr17@2x.jpg" alt="별 카드"></div>
  <div class="title"><span class="num">XVII</span><span class="name">별</span></div>
  <p class="msg"><span class="mk">다시 희망이 차오르는</span> 카드예요</p>
  <div class="mound"></div>
  <img class="octo" src="../../images/mm01.png" alt="" style="top:1690px;width:360px;margin-left:-180px">
</div>

 [[60,800,8,'#FFF'],[1030,820,9,'#FFF'],[200,1720,8,'#FFF'],[880,1720,8,'#FFF']])</script>
</body></html>
